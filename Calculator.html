            font-size: 28px;

<body>

    <div class="calculator">

        <header>
            <div>
                <h1>Scientific Calculator</h1>
                <p>Calculate anything, simply.</p>
            </div>

            <div class="top-buttons">
                <button id="angleMode">DEG</button>
                <button id="clearHistory">Clear History</button>
            </div>
        </header>

        <div class="main">

            <section class="calc-panel">

                <div class="display-tools">
                    <span id="modeLabel">DEGREE MODE</span>
                    <span>Keyboard supported</span>
                </div>

                <div class="display-area">
                    <div class="expression" id="expression"></div>
                    <input type="text" id="display" value="0" readonly>
                </div>

                <div class="keypad">

                    <button class="key function" data-value="sin(">sin</button>
                    <button class="key function" data-value="cos(">cos</button>
                    <button class="key function" data-value="tan(">tan</button>
                    <button class="key function" data-value="log(">log</button>
                    <button class="key function" data-value="ln(">ln</button>
                    <button class="key clear" data-action="clear">AC</button>

                    <button class="key function" data-value="asin(">sin⁻¹</button>
                    <button class="key function" data-value="acos(">cos⁻¹</button>
                    <button class="key function" data-value="atan(">tan⁻¹</button>
                    <button class="key function" data-value="sqrt(">√</button>
                    <button class="key function" data-value="^2">x²</button>
                    <button class="key clear" data-action="delete">DEL</button>

                    <button class="key function" data-value="π">π</button>
                    <button class="key function" data-value="e">e</button>
                    <button class="key function" data-value="^">xʸ</button>
                    <button class="key function" data-value="(">(</button>
                    <button class="key function" data-value=")">)</button>
                    <button class="key operator" data-value="/">÷</button>

                    <button class="key" data-value="7">7</button>
                    <button class="key" data-value="8">8</button>
                    <button class="key" data-value="9">9</button>
                    <button class="key function" data-value="!">n!</button>
                    <button class="key operator" data-value="%">%</button>
                    <button class="key operator" data-value="*">×</button>

                    <button class="key" data-value="4">4</button>
                    <button class="key" data-value="5">5</button>
                    <button class="key" data-value="6">6</button>
                    <button class="key function" data-value="1/">1/x</button>
                    <button class="key function" data-action="sign">+/−</button>
                    <button class="key operator" data-value="-">−</button>

                    <button class="key" data-value="1">1</button>
                    <button class="key" data-value="2">2</button>
                    <button class="key" data-value="3">3</button>
                    <button class="key function" data-value="Ans">Ans</button>
                    <button class="key function" data-value=".">.</button>
                    <button class="key operator" data-value="+">+</button>

                    <button class="key function" data-action="clear">C</button>
                    <button class="key" data-value="0">0</button>
                    <button class="key function" data-value="00">00</button>
                    <button class="key function" data-value="(">(</button>
                    <button class="key function" data-value=")">)</button>
                    <button class="key equal" data-action="calculate">=</button>

                </div>
            </section>

            <aside class="history-panel">
                <h2>Calculation History</h2>
                <p>Your recent calculations appear here.</p>

                <div class="history-list" id="historyList">
                    <div class="history-empty">No calculations yet</div>
                </div>
            </aside>

        </div>

        <footer>
            Scientific Calculator | HTML, CSS and JavaScript
        </footer>

    </div>

    <script>
        const display = document.getElementById("display");
        const expressionBox = document.getElementById("expression");
        const historyList = document.getElementById("historyList");

        let expression = "";
        let answer = 0;
        let angleMode = "DEG";
        let finished = false;
        let history = [];

        function updateDisplay() {
            display.value = expression || "0";
        }
        function addValue(value) {
            if (finished && /[0-9.]/.test(value)) {
                expression = "";
                expressionBox.textContent = "";
                finished = false;
            } else if (finished) {
                finished = false;
            }
            if (value === "Ans") {
                value = String(answer);
            }
            if (value === "00" && expression === "") {
                value = "0";
            }
            if (value === "^2") {
                expression += "^2";
            } else if (value === "1/") {
                expression += "1/(";
            } else {
                expression += value;
            }
            updateDisplay();
        }
        function clearAll() {
            expression = "";
            expressionBox.textContent = "";
            finished = false;
            updateDisplay();
        }
        function deleteLast() {
            if (finished) {
                clearAll();
                return;
            }
            expression = expression.slice(0, -1);
            updateDisplay();
        }
        function changeSign() {
            if (!expression) {
                return;
            }
            expression = "(-1*(" + expression + "))";
            finished = false;
            updateDisplay();
        }
        function factorial(number) {
            if (number < 0 || !Number.isInteger(number) || number > 170) {
                throw new Error("Invalid factorial");
            }
            let result = 1;
            for (let i = 2; i <= number; i++) {
                result *= i;
            }
            return result;
        }
        function calculate() {
            if (!expression) {
                return;
            }
            try {
                let input = expression;
                let js = input
                    .replace(/π/g, "Math.PI")
                    .replace(/\be\b/g, "Math.E")
                    .replace(/sqrt\(/g, "Math.sqrt(")
                    .replace(/log\(/g, "Math.log10(")
                    .replace(/ln\(/g, "Math.log(")
                    .replace(/asin\(/g, "Math.asin(")
                    .replace(/acos\(/g, "Math.acos(")
                    .replace(/atan\(/g, "Math.atan(");
                js = js
                    .replace(/sin\(/g, "Math.sin(")
                    .replace(/cos\(/g, "Math.cos(")
                    .replace(/tan\(/g, "Math.tan(");
                if (angleMode === "DEG") {
                    js = js
                        .replace(/Math\.sin\(/g, "Math.sin(Math.PI/180*")
                        .replace(/Math\.cos\(/g, "Math.cos(Math.PI/180*")
                        .replace(/Math\.tan\(/g, "Math.tan(Math.PI/180*");
                    js = js
                        .replace(/Math\.asin\(([^()]*)\)/g, "(180/Math.PI*Math.asin($1))")
                        .replace(/Math\.acos\(([^()]*)\)/g, "(180/Math.PI*Math.acos($1))")
                        .replace(/Math\.atan\(([^()]*)\)/g, "(180/Math.PI*Math.atan($1))");
                }
                js = js.replace(/(\d+(?:\.\d+)?)%/g, "($1/100)");
                js = js.replace(/\^/g, "**");
                js = js.replace(/(\d+(?:\.\d+)?)!/g, "factorial($1)");
                if (!/^[0-9+\-*/().,\sA-Za-z]*$/.test(js)) {
                    throw new Error("Invalid expression");
                }
                const result = Function(
                    "factorial",
                    '"use strict"; return (' + js + ')'
                )(factorial);
                if (typeof result !== "number" || !Number.isFinite(result)) {
                    throw new Error("Math error");
                }
                answer = result;
                history.unshift({
                    expression: input,
                    result: Number(result.toPrecision(12)).toString()
                });
                if (history.length > 10) {
                    history.pop();
                }
                expressionBox.textContent = input + " =";
                expression = Number(result.toPrecision(12)).toString();
                finished = true;
                updateDisplay();
                showHistory();
            } catch (error) {
                expressionBox.textContent = "Invalid expression";
                display.value = "Error";
                expression = "";
                finished = true;
            }
        }
        function showHistory() {
            historyList.innerHTML = "";
            if (history.length === 0) {
                historyList.innerHTML =
                    '<div class="history-empty">No calculations yet</div>';
                return;
            }
            history.forEach(function(item) {
                const row = document.createElement("div");
                row.className = "history-item";
                const exp = document.createElement("div");
                exp.className = "history-expression";
                exp.textContent = item.expression;
                const res = document.createElement("div");
                res.className = "history-result";
                res.textContent = "= " + item.result;
                row.append(exp, res)
                row.addEventListener("click", function() {
                    expression = item.result;
                    expressionBox.textContent = item.expression + " =";
                    finished = true;
                    updateDisplay();
                });
                historyList.appendChild(row);
            });
        }

        document.querySelectorAll("[data-value]").forEach(function(button) {
            button.addEventListener("click", function() {
                addValue(button.dataset.value);
            });
        });
        document.querySelectorAll("[data-action]").forEach(function(button) {
            button.addEventListener("click", function() {
                const action = button.dataset.action;
                if (action==="clear") {
                    clearAll();
                } else if (action==="delete") {
                    deleteLast();
                } else if (action==="calculate") {
                    calculate();
                } else if (action==="sign") {
                    changeSign();
                }
            });
        });
        document.getElementById("angleMode").addEventListener("click", function() {
            angleMode = angleMode === "DEG" ? "RAD" : "DEG";
            this.textContent = angleMode;
            document.getElementById("modeLabel").textContent =
                angleMode === "DEG" ? "DEGREE MODE" : "RADIAN MODE";
        });
        document.getElementById("clearHistory").addEventListener("click", function() {
            history = [];
            showHistory();
        });
        document.addEventListener("keydown", function(event) {
            if (/^[0-9.]$/.test(event.key)) {
                addValue(event.key);
            } else if (["+", "-", "*", "/", "%", "(", ")", "^"].includes(event.key)) {
                addValue(event.key);
            } else if (event.key === "Enter" || event.key === "=") {
                event.preventDefault();
                calculate();
            } else if (event.key === "Backspace") {
                deleteLast();
            } else if (event.key === "Escape") {
                clearAll();
            }
        });
        updateDisplay();
    </script>

</body>
</html>
